name: Wire Multiband Cross 4

on:
  push:
    branches: [fix/punch-v2]

permissions:
  contents: write

jobs:
  wire:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/punch-v2
          fetch-depth: 0

      - name: Wire Cross 4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vm = Path('app/src/main/java/com/zeus/v2/EqViewModel.kt')
          s = vm.read_text()
          s = s.replace('var crossoverFrequencies = mutableStateListOf(180f, 1800f, 8000f)', 'var crossoverFrequencies = mutableStateListOf(180f, 1800f, 8000f, 16000f)')
          old = '''    fun setCrossover(index: Int, freq: Float) {
        if (index !in 0..2) return
        val f = freq.coerceIn(40f, 19500f)
        when (index) {
            0 -> crossoverFrequencies[0] = f.coerceAtMost(crossoverFrequencies[1] - 50f)
            1 -> crossoverFrequencies[1] = f.coerceIn(
                crossoverFrequencies[0] + 50f,
                crossoverFrequencies[2] - 50f
            )
            2 -> crossoverFrequencies[2] = f.coerceAtLeast(crossoverFrequencies[1] + 50f)
        }
    }'''
          new = '''    fun setCrossover(index: Int, freq: Float) {
        if (index !in 0..3) return
        when (index) {
            0 -> crossoverFrequencies[0] = freq.coerceIn(40f, crossoverFrequencies[1] - 50f)
            1 -> crossoverFrequencies[1] = freq.coerceIn(crossoverFrequencies[0] + 50f, crossoverFrequencies[2] - 50f)
            2 -> crossoverFrequencies[2] = freq.coerceIn(crossoverFrequencies[1] + 50f, crossoverFrequencies[3] - 50f)
            3 -> crossoverFrequencies[3] = freq.coerceIn(crossoverFrequencies[2] + 50f, 20000f)
        }
    }'''
          if old not in s:
              raise SystemExit('EqViewModel crossover block not found')
          vm.write_text(s.replace(old, new))

          settings = Path('app/src/main/java/com/zeus/v2/EqSettings.kt')
          s = settings.read_text()
          s = s.replace('var cross3: Float = 8000f,', 'var cross3: Float = 8000f,\n    var cross4: Float = 16000f,')
          s = s.replace('o.put("compEnabled", compEnabled); o.put("cross1", cross1.toDouble()); o.put("cross2", cross2.toDouble()); o.put("cross3", cross3.toDouble())', 'o.put("compEnabled", compEnabled); o.put("cross1", cross1.toDouble()); o.put("cross2", cross2.toDouble()); o.put("cross3", cross3.toDouble()); o.put("cross4", cross4.toDouble())')
          s = s.replace('s.compEnabled=o.optBoolean("compEnabled",true);s.cross1=o.optDouble("cross1",180.0).toFloat();s.cross2=o.optDouble("cross2",1800.0).toFloat();s.cross3=o.optDouble("cross3",8000.0).toFloat()', 's.compEnabled=o.optBoolean("compEnabled",true);s.cross1=o.optDouble("cross1",180.0).toFloat();s.cross2=o.optDouble("cross2",1800.0).toFloat();s.cross3=o.optDouble("cross3",8000.0).toFloat();s.cross4=o.optDouble("cross4",16000.0).toFloat()')
          settings.write_text(s)

          screen = Path('app/src/main/java/com/zeus/v2/MainScreen.kt')
          s = screen.read_text()
          s = s.replace('''                    freq = 20000f,
                    range = 20000f..20000f,
                    onSelect = { selectedCompBand = 3 },
                    onFreq = { },
                    enabled = false,''', '''                    freq = viewModel.crossoverFrequencies[3],
                    range = 9000f..20000f,
                    onSelect = { selectedCompBand = 3 },
                    onFreq = { viewModel.setCrossover(3, it) },
                    enabled = true,''')
          s = s.replace('''            cross3 = viewModel.crossoverFrequencies[2],
            colors = colors,''', '''            cross3 = viewModel.crossoverFrequencies[2],
            cross4 = viewModel.crossoverFrequencies[3],
            colors = colors,''')
          s = s.replace('''    cross3: Float,
    colors: List<Color>,''', '''    cross3: Float,
    cross4: Float,
    colors: List<Color>,''')
          s = s.replace('''        val cuts = listOf(minF, cross1, cross2, cross3, maxF)''', '''        val cuts = listOf(minF, cross1, cross2, cross3, cross4, maxF)''')
          s = s.replace('''        for (i in 0 until 4) {''', '''        for (i in 0 until 5) {''', 1)
          s = s.replace('''        listOf(cross1, cross2, cross3).forEach { c ->''', '''        listOf(cross1, cross2, cross3, cross4).forEach { c ->''')
          screen.write_text(s)
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/zeus/v2/EqViewModel.kt app/src/main/java/com/zeus/v2/EqSettings.kt app/src/main/java/com/zeus/v2/MainScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "Enable configurable multiband Cross 4 [skip ci]"
          git push origin HEAD:fix/punch-v2
