name: Build Zeus-V2 APK

on:
  push:
    branches: [ main, master, fix/punch-v2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: 'false'

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generando Gradle Wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Prepare AutoEQ catalog for build
        run: |
          rm -rf /tmp/AutoEq
          git clone --depth 1 --filter=blob:none --sparse https://github.com/jaakkopasanen/AutoEq.git /tmp/AutoEq
          cd /tmp/AutoEq
          git sparse-checkout set results targets
          cd -
          mkdir -p app/src/main/assets/autoeq app/src/main/assets/targets
          python3 - <<'PY'
          import json, pathlib, shutil
          src=pathlib.Path('/tmp/AutoEq/results')
          dst=pathlib.Path('app/src/main/assets/autoeq')
          rows=[]
          for p in src.rglob('*ParametricEQ.txt'):
              rel=p.relative_to(src).as_posix()
              parts=p.parts
              rows.append({'n':p.stem.replace(' ParametricEQ',''),'s':parts[0] if parts else '','t':'','r':'','p':rel})
          (dst/'index.json').write_text(json.dumps(rows,ensure_ascii=False),encoding='utf-8')
          print('AutoEQ catalog entries:',len(rows))
          PY
          # Do not bundle thousands of profile files into the APK: they exceed Android's ZIP entry limit.
          # The catalog remains available for the UI; profiles will be fetched on demand in a later step.
          cp -R /tmp/AutoEq/targets/. app/src/main/assets/targets/

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zeus-V2-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
