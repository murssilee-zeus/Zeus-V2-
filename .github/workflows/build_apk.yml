name: Build Zeus-V2 APK

on:
  push:
    branches: [ main, master, fix/punch-v2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply adaptive EQ surgery once
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p = Path('app/src/main/java/com/zeus/v2/AudioEngine.kt')
          s = p.read_text()
          if 'private const val TARGET_PRE_EQ_BANDS = 128' in s:
              print('Adaptive EQ surgery already present.')
          else:
              s = s.replace('private const val TARGET_PRE_EQ_BANDS = 64', 'private const val TARGET_PRE_EQ_BANDS = 128')
              s = s.replace('private const val FALLBACK_PRE_EQ_BANDS = 48', 'private const val FALLBACK_PRE_EQ_BANDS = 127')
              s = s.replace('private const val MIN_PRE_EQ_BANDS = 32', 'private const val MIN_PRE_EQ_BANDS = 64')
              s = s.replace('private const val MIN_FREQ = 20f', 'private const val MIN_FREQ = 10f')
              s = s.replace('val candidates = listOf(TARGET_PRE_EQ_BANDS, FALLBACK_PRE_EQ_BANDS, MIN_PRE_EQ_BANDS, 18)', 'val candidates = listOf(TARGET_PRE_EQ_BANDS, FALLBACK_PRE_EQ_BANDS, MIN_PRE_EQ_BANDS, 48, 32, 18)')
              new_apply = '''    private fun applyEq() {
        val dp = dynamicsProcessing ?: return

        try {
            val s = settings
            val converted = ParametricToDpConverter.convert(
                bands = s.bands,
                sampleRate = deviceSampleRate,
                bandCount = preEqBandCount,
                lowShelfEnabled = lowShelfTag,
                peakEnabled = peakTag,
                highShelfEnabled = highShelfTag,
                subBoost = s.subBoost
            )

            val count = minOf(preEqBandCount, converted.cutoffs.size)
            for (i in 0 until count) {
                dp.setPreEqBandAllChannelsTo(
                    i,
                    DynamicsProcessing.EqBand(true, converted.cutoffs[i], converted.gains[i])
                )
            }
        } catch (e: Exception) {
            Log.e(TAG, "eq: " + e.message)
        }
    }

'''
              s2, n = re.subn(r'    private fun applyEq\(\) \{.*?\n    \}\n\n    private fun tagAllowed', new_apply + '    private fun tagAllowed', s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('applyEq block not found')
              p.write_text(s2)
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add',str(p)],check=True)
              subprocess.run(['git','commit','-m','Use adaptive 128-band EQ conversion'],check=True)
              subprocess.run(['git','push','origin','HEAD:fix/punch-v2'],check=True)
              print('Adaptive EQ surgery committed and pushed.')

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: 'false'

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generando Gradle Wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Prepare AutoEQ catalog for build
        run: |
          rm -rf /tmp/AutoEq
          git clone --depth 1 --filter=blob:none --sparse https://github.com/jaakkopasanen/AutoEq.git /tmp/AutoEq
          cd /tmp/AutoEq
          git sparse-checkout set results targets
          cd -
          mkdir -p app/src/main/assets/autoeq app/src/main/assets/targets
          python3 - <<'PY'
          import json, pathlib, shutil
          src=pathlib.Path('/tmp/AutoEq/results')
          dst=pathlib.Path('app/src/main/assets/autoeq')
          rows=[]
          for p in src.rglob('*ParametricEQ.txt'):
              rel=p.relative_to(src).as_posix()
              parts=p.parts
              rows.append({'n':p.stem.replace(' ParametricEQ',''),'s':parts[0] if parts else '','t':'','r':'','p':rel})
          (dst/'index.json').write_text(json.dumps(rows,ensure_ascii=False),encoding='utf-8')
          print('AutoEQ catalog entries:',len(rows))
          PY
          cp -R /tmp/AutoEq/targets/. app/src/main/assets/targets/

      - name: Restore signing keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > zeus-debug.keystore
            echo "Keystore estable restaurado desde el secreto."
          else
            echo "::warning::Falta el secreto DEBUG_KEYSTORE_B64. El APK se firmara con una clave debug aleatoria y NO podra instalarse encima de una build anterior."
          fi

      - name: Build Debug APK
        env:
          VERSION_CODE: ${{ 100 + github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-1\|Signer"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zeus-V2-debug-v${{ 100 + github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
