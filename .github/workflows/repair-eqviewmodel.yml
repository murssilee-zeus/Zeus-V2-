name: Repair EqViewModel
on:
  push:
    branches: [fix/punch-v2]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/punch-v2
      - name: Restore known-good EqViewModel and remove duplicate cross4
        shell: bash
        run: |
          set -euo pipefail
          git checkout 4789fc55ddf085a967d8c7551b6a9ad7327bf0c1 -- app/src/main/java/com/zeus/v2/EqViewModel.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/zeus/v2/EqViewModel.kt')
          s = p.read_text()
          old = 'cross4 = crossoverFrequencies.getOrElse(3) { 20000f }, cross4 = crossoverFrequencies.getOrElse(3) { 20000f }, cross4 = crossoverFrequencies.getOrElse(3) { 20000f },'
          if old in s:
              s = s.replace(old, 'cross4 = crossoverFrequencies.getOrElse(3) { 20000f },', 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zeus/v2/EqViewModel.kt
          git commit -m 'fix: restore EqViewModel and remove duplicate cross4'
          git push origin fix/punch-v2
