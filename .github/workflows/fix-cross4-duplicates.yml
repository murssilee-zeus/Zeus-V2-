name: Fix Cross 4 duplicates

on:
  push:
    branches: [fix/punch-v2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/punch-v2
          fetch-depth: 1
      - name: Clean Cross 4 serialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/zeus/v2/EqViewModel.kt')
          s=p.read_text()
          # Keep exactly one Cross4 named argument in EqSettings serialization.
          pat=re.compile(r'(cross1\s*=\s*crossoverFrequencies\.getOrElse\(0\)\s*\{\s*180f\s*\},\s*cross2\s*=\s*crossoverFrequencies\.getOrElse\(1\)\s*\{\s*1800f\s*\},\s*cross3\s*=\s*crossoverFrequencies\.getOrElse\(2\)\s*\{\s*8000f\s*\},)(?:\s*cross4\s*=\s*crossoverFrequencies\.getOrElse\(3\)\s*\{\s*20000f\s*\},)+')
          s,n=pat.subn(r'\1 cross4 = crossoverFrequencies.getOrElse(3) { 20000f },',s,count=0)
          if n==0:
              raise SystemExit('No Cross4 serialization sequence found')
          p.write_text(s)
          PY
          git config user.name 'zeus-autoeq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize Cross 4 setting serialization'
          git push origin HEAD:fix/punch-v2
