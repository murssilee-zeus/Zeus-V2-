name: Remove infrasonic protection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-protection:
    if: github.event.head_commit.message != 'Remove 16 Hz infrasonic protection'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove 16 Hz infrasonic protection
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/zeus/v2/AudioEngine.kt')
          s = p.read_text(encoding='utf-8')
          old = '''            // Proteccion infrasonica SUAVE (mantiene punch)\n            when {\n                freq <= 10f -> totalDb -= 18f\n                freq <= 14f -> totalDb -= 10f\n                freq <= 16f -> totalDb -= 6f\n                freq < 20f -> totalDb -= 2f\n            }\n\n'''
          if old not in s:
              raise SystemExit('Protection block not found; no changes made.')
          p.write_text(s.replace(old, ''), encoding='utf-8')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/zeus/v2/AudioEngine.kt
          git commit -m "Remove 16 Hz infrasonic protection"
          git push
