name: Patch configuration import UI
on:
  push:
    branches: [fix/punch-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/punch-v2
          fetch-depth: 0
      - name: Patch screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/zeus/v2/ZeusStudioScreenV2.kt')
          s=p.read_text()
          old='fun ZeusStudioScreenV2(vm:EqViewModel,punch:PunchViewModel,onToggleEngine:()->Unit,onSave:()->Unit,onExport:()->Unit){'
          new='fun ZeusStudioScreenV2(vm:EqViewModel,punch:PunchViewModel,onToggleEngine:()->Unit,onSave:()->Unit,onExport:()->Unit,onImport:()->Unit){'
          s=s.replace(old,new)
          marker='Text("EXPORTAR JSON",color=Color.White,fontSize=9.sp,fontWeight=FontWeight.Bold,modifier=Modifier.background(ZP,RoundedCornerShape(6.dp)).clickable{showSettings=false;onExport()}.padding(8.dp))'
          replacement=marker+'\n    Text("IMPORTAR JSON",color=Color.White,fontSize=9.sp,fontWeight=FontWeight.Bold,modifier=Modifier.background(ZSUR,RoundedCornerShape(6.dp)).border(1.dp,ZP,RoundedCornerShape(6.dp)).clickable{showSettings=false;onImport()}.padding(8.dp))'
          s=s.replace(marker,replacement)
          p.write_text(s)
          PY
          git config user.name 'zeus-autoeq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/zeus/v2/ZeusStudioScreenV2.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add configuration import button'
          git push origin HEAD:fix/punch-v2
