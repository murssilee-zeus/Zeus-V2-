name: AutoEQ UI interpolation fix
on:
  push:
    branches:
      - fix/punch-v2
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/punch-v2
          fetch-depth: 0
      - name: Fix literal error placeholder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/zeus/v2/ZeusStudioScreenV2.kt')
          s = p.read_text()
          pattern = r'\\\$\{it\.message\}'
          replacement = '${it.message ?: "Error desconocido"}'
          s2, count = re.subn(pattern, replacement, s)
          print('AutoEQ interpolation replacements:', count)
          if count:
              p.write_text(s2)
          PY
          git config user.name 'zeus-autoeq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/zeus/v2/ZeusStudioScreenV2.kt
          if git diff --cached --quiet; then echo 'No UI change'; else git commit -m 'Fix AutoEQ error message interpolation'; git push origin HEAD:fix/punch-v2; fi
