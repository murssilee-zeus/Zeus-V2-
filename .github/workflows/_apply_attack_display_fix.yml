name: Apply Attack Display Fix

on:
  push:
    branches: [ fix/punch-v2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Attack precision display
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/zeus/v2/MainScreen.kt')
          s = p.read_text()
          pattern = r'(range\s*=\s*0\.01f\.\.100f,\s*\n\s*format\s*=\s*)\{ String\.format\("%\.1f", it\) \}'
          new = r'\1{ if (it < 1f) String.format("%.2f", it) else String.format("%.1f", it) }'
          s2, n = re.subn(pattern, new, s, count=1)
          if n != 1:
              raise SystemExit(f'Attack display pattern not found, matches={n}')
          p.write_text(s2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zeus/v2/MainScreen.kt
          git commit -m 'Fix limiter Attack precision display'
          git push
