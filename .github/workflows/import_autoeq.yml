name: Import AutoEQ catalog

on:
  push:
    branches: [fix/punch-v2]
    paths:
      - '.github/workflows/import_autoeq.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Zeus
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone official AutoEq into /tmp/AutoEq
        run: |
          rm -rf /tmp/AutoEq
          git clone --depth 1 --filter=blob:none --sparse https://github.com/jaakkopasanen/AutoEq.git /tmp/AutoEq
          cd /tmp/AutoEq
          git sparse-checkout set results targets
          git lfs install --local || true
          git lfs pull || true
          echo "AutoEq commit: $(git rev-parse HEAD)"
          echo "ParametricEQ paths in git tree: $(git ls-tree -r --name-only HEAD results | grep -E '/ParametricEQ\.txt$' | wc -l)"
          echo "ParametricEQ files on disk: $(find results -type f -name 'ParametricEQ.txt' | wc -l)"

      - name: Scan ParametricEQ files and import target curves
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import shutil
          import subprocess

          src = Path('/tmp/AutoEq')
          results = src / 'results'
          targets = src / 'targets'
          out_index = Path('app/src/main/assets/autoeq/index.json')
          out_targets = Path('app/src/main/assets/targets')
          out_index.parent.mkdir(parents=True, exist_ok=True)
          out_targets.mkdir(parents=True, exist_ok=True)

          preamp_re = re.compile(r'^Preamp:\s*([-+]?\d+(?:\.\d+)?)\s*dB\s*$', re.I)
          filter_re = re.compile(r'^Filter\s+\d+:\s+ON\s+(\S+)\s+Fc\s+([-+]?\d+(?:\.\d+)?)\s+Hz\s+Gain\s+([-+]?\d+(?:\.\d+)?)\s+dB\s+Q\s+([-+]?\d+(?:\.\d+)?)', re.I)

          files = sorted(results.rglob('ParametricEQ.txt'))
          if len(files) < 8000:
              raise SystemExit(f'Expected 8000+ ParametricEQ.txt files, found {len(files)}')

          entries = []
          for p in files:
              rel = p.relative_to(results).as_posix()
              parts = p.relative_to(results).parts
              text = p.read_text(encoding='utf-8', errors='replace')
              preamp = None
              filter_count = 0
              filter_types = set()
              for line in text.splitlines():
                  line = line.strip()
                  m = preamp_re.match(line)
                  if m:
                      preamp = float(m.group(1))
                      continue
                  m = filter_re.match(line)
                  if m:
                      filter_count += 1
                      filter_types.add(m.group(1).upper())

              model = p.parent.name
              if model.endswith(' ParametricEQ'):
                  model = model[:-12]
              entries.append({
                  'id': hashlib.sha1(rel.encode('utf-8')).hexdigest()[:12],
                  'name': model,
                  'source': parts[0] if len(parts) > 0 else '',
                  'target': parts[1] if len(parts) > 1 else '',
                  'path': rel,
                  'preampDb': preamp,
                  'filterCount': filter_count,
                  'filterTypes': sorted(filter_types),
              })

          index = {
              'schema': 1,
              'source': 'jaakkopasanen/AutoEq',
              'sourceCommit': subprocess.check_output(['git','-C',str(src),'rev-parse','HEAD'], text=True).strip(),
              'generatedBy': 'Zeus-V2 AutoEQ importer',
              'modelCount': len(entries),
              'entries': entries,
          }
          out_index.write_text(json.dumps(index, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          copied = 0
          for p in sorted(targets.rglob('*')):
              if not p.is_file() or p.name.startswith('.') or p.suffix.lower() != '.csv':
                  continue
              rel = p.relative_to(targets)
              dest = out_targets / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(p, dest)
              copied += 1

          (out_index.parent / 'SOURCE.txt').write_text(
              'AutoEQ catalog and target curves imported from https://github.com/jaakkopasanen/AutoEq\n'
              'AutoEQ is MIT licensed. Target/measurement data may have their own provenance; source paths are preserved.\n',
              encoding='utf-8')

          print(f'ParametricEQ.txt scanned: {len(files)}')
          print(f'Index entries: {len(entries)}')
          print(f'Target CSV files copied: {copied}')
          PY

      - name: Commit imported AutoEQ data
        run: |
          git config user.name 'zeus-autoeq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/assets/autoeq app/src/main/assets/targets
          git diff --cached --quiet && echo 'No AutoEQ changes' && exit 0
          git commit -m 'Import AutoEQ catalog and target curves [skip ci]'
          git push origin HEAD:fix/punch-v2
