name: Import AutoEQ catalog

on:
  push:
    branches: [fix/punch-v2]
    paths:
      - '.github/workflows/import_autoeq.yml'
      - 'tools/import_autoeq.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Zeus
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone official AutoEq
        run: |
          rm -rf /tmp/AutoEq
          git clone --depth 1 https://github.com/jaakkopasanen/AutoEq.git /tmp/AutoEq
          echo "AUTOEQ_COMMIT=$(git -C /tmp/AutoEq rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Import catalog and targets
        run: python3 tools/import_autoeq.py

      - name: Commit imported AutoEQ data
        run: |
          git config user.name 'zeus-autoeq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/assets/autoeq app/src/main/assets/targets
          git diff --cached --quiet && echo 'No AutoEQ changes' && exit 0
          git commit -m 'Import AutoEQ catalog and target curves [skip ci]'
          git push origin HEAD:fix/punch-v2
