name: Verify Cross 4 Build

on:
  push:
    branches: [fix/punch-v2]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/punch-v2
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: 'false'
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.7; fi
          chmod +x ./gradlew
      - name: Prepare AutoEQ catalog
        run: |
          rm -rf /tmp/AutoEq
          git clone --depth 1 --filter=blob:none --sparse https://github.com/jaakkopasanen/AutoEq.git /tmp/AutoEq
          cd /tmp/AutoEq && git sparse-checkout set results targets && cd -
          mkdir -p app/src/main/assets/autoeq app/src/main/assets/targets
          python3 - <<'PY'
          import json,pathlib
          src=pathlib.Path('/tmp/AutoEq/results'); dst=pathlib.Path('app/src/main/assets/autoeq'); rows=[]
          for p in src.rglob('*ParametricEQ.txt'):
              rel=p.relative_to(src).as_posix(); parts=p.parts
              rows.append({'n':p.stem.replace(' ParametricEQ',''),'s':parts[0] if parts else '','t':'','r':'','p':rel})
          (dst/'index.json').write_text(json.dumps(rows,ensure_ascii=False),encoding='utf-8')
          PY
          cp -R /tmp/AutoEq/targets/. app/src/main/assets/targets/
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Zeus-V2-Cross4-verify-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
      - name: Remove one-shot workflow
        if: success()
        run: |
          rm -f .github/workflows/verify-cross4-build.yml
          git config user.name 'zeus-autoeq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove one-shot Cross 4 verifier'
          git push origin HEAD:fix/punch-v2
