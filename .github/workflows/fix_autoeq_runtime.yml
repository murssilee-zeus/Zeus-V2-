name: Fix AutoEQ runtime loading
on:
  push:
    branches: [fix/punch-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/punch-v2
      - name: Patch AutoEQ runtime and UI error handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/zeus/v2/ZeusStudioScreenV2.kt')
          s = p.read_text()
          old = '"Error: \\${it.message}"'
          new = '"Error: ${it.message ?: \"Error desconocido\"}"'
          if old in s:
              s = s.replace(old, new)
          else:
              print('UI interpolation already fixed or pattern absent')
          p.write_text(s)

          p = Path('app/src/main/java/com/zeus/v2/AutoEqRepository.kt')
          s = p.read_text()
          old = '''    private fun readIndex(context: Context): List<AutoEqModel> = runCatching {
        val json = context.assets.open("autoeq/index.json").bufferedReader().use { it.readText() }
        val arr = JSONArray(json)
        buildList {
            for (i in 0 until arr.length()) {
                val o = arr.getJSONObject(i)
                add(AutoEqModel(o.optString("n"), o.optString("s"), o.optString("t"), o.optString("p")))
            }
        }
    }.getOrDefault(emptyList())'''
          new = '''    private fun readIndex(context: Context): List<AutoEqModel> = runCatching {
        val json = context.assets.open("autoeq/index.json").bufferedReader().use { it.readText() }
        val root = org.json.JSONTokener(json).nextValue()
        val arr = when (root) {
            is JSONArray -> root
            is org.json.JSONObject -> root.optJSONArray("entries") ?: JSONArray()
            else -> JSONArray()
        }
        buildList {
            for (i in 0 until arr.length()) {
                val o = arr.getJSONObject(i)
                add(AutoEqModel(
                    o.optString("n", o.optString("name")),
                    o.optString("s", o.optString("source")),
                    o.optString("t", o.optString("target")),
                    o.optString("p", o.optString("path"))
                ))
            }
        }
    }.getOrDefault(emptyList())'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''    suspend fun load(context: Context, model: AutoEqModel): AutoEqProfile = withContext(Dispatchers.IO) {
        require(model.path.isNotBlank()) { "Perfil AutoEQ no disponible" }
        val text = context.assets.open("autoeq/profiles/" + model.path).bufferedReader().use { it.readText() }
        parse(text)
    }'''
          new = '''    suspend fun load(context: Context, model: AutoEqModel): AutoEqProfile = withContext(Dispatchers.IO) {
        require(model.path.isNotBlank()) { "Perfil AutoEQ no disponible" }
        val localPath = "autoeq/profiles/" + model.path
        val text = runCatching {
            context.assets.open(localPath).bufferedReader().use { it.readText() }
        }.getOrElse {
            val encoded = model.path.split('/').joinToString("/") { java.net.URLEncoder.encode(it, "UTF-8").replace("+", "%20") }
            val url = "https://raw.githubusercontent.com/jaakkopasanen/AutoEq/master/results/$encoded"
            val req = java.net.URL(url).openConnection().apply {
                connectTimeout = 15000
                readTimeout = 30000
                setRequestProperty("User-Agent", "Zeus-V2-AutoEQ/1.0")
            }
            req.getInputStream().bufferedReader().use { it.readText() }
        }
        parse(text)
    }'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git config user.name 'zeus-autoeq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/zeus/v2/ZeusStudioScreenV2.kt app/src/main/java/com/zeus/v2/AutoEqRepository.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Fix AutoEQ profile loading and error message'
          git push origin HEAD:fix/punch-v2
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix_autoeq_runtime.yml
          git commit -m 'Remove temporary AutoEQ runtime patch workflow'
          git push origin HEAD:fix/punch-v2
