name: Remove 16Hz protection on fix

on:
  push:
    branches:
      - fix/punch-v2

jobs:
  remove-protection:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove infrasonic protection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/zeus/v2/AudioEngine.kt')
          s = p.read_text()
          old = '''                when {\n                    freq <= 10f -> totalDb -= 18f\n                    freq <= 14f -> totalDb -= 10f\n                    freq <= 16f -> totalDb -= 6f\n                    freq < 20f -> totalDb -= 2f\n                }\n\n'''
          if old not in s:
              raise SystemExit('Target 16Hz protection block not found; refusing to modify file')
          p.write_text(s.replace(old, ''))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/zeus/v2/AudioEngine.kt
          git commit -m "Remove 16 Hz infrasonic protection" || exit 0
          git push
