name: Wire Zeus Spatial foundation
on:
  push:
    branches: [fix/punch-v2]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/punch-v2
          fetch-depth: 0
      - name: Patch spatial integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              original = s
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Missing patch anchor in {path}: {old[:80]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s)
              print(path, 'changed:', s != original)

          patch('app/src/main/java/com/zeus/v2/EqSettings.kt', [
              ('var hiResEnabled: Boolean = false\n)', 'var hiResEnabled: Boolean = false,\n    var spatialEnabled: Boolean = false,\n    var spatialWidth: Float = 35f\n)'),
              ('o.put("audioSessionEnabled", audioSessionEnabled); o.put("selectedAudioSession", selectedAudioSession); o.put("hiResEnabled", hiResEnabled)', 'o.put("audioSessionEnabled", audioSessionEnabled); o.put("selectedAudioSession", selectedAudioSession); o.put("hiResEnabled", hiResEnabled); o.put("spatialEnabled", spatialEnabled); o.put("spatialWidth", spatialWidth.toDouble())'),
              ('s.pipelineEnabled=o.optBoolean("pipelineEnabled",true);s.lowShelfEnabled=o.optBoolean("lowShelfEnabled",true);s.peakEnabled=o.optBoolean("peakEnabled",true);s.highShelfEnabled=o.optBoolean("highShelfEnabled",true);s.audioSessionEnabled=o.optBoolean("audioSessionEnabled",false);s.selectedAudioSession=o.optString("selectedAudioSession","0: LOAD - Audio TX Output (Float)");s.hiResEnabled=o.optBoolean("hiResEnabled",false)', 's.pipelineEnabled=o.optBoolean("pipelineEnabled",true);s.lowShelfEnabled=o.optBoolean("lowShelfEnabled",true);s.peakEnabled=o.optBoolean("peakEnabled",true);s.highShelfEnabled=o.optBoolean("highShelfEnabled",true);s.audioSessionEnabled=o.optBoolean("audioSessionEnabled",false);s.selectedAudioSession=o.optString("selectedAudioSession","0: LOAD - Audio TX Output (Float)");s.hiResEnabled=o.optBoolean("hiResEnabled",false);s.spatialEnabled=o.optBoolean("spatialEnabled",false);s.spatialWidth=o.optDouble("spatialWidth",35.0).toFloat().coerceIn(0f,100f)')
          ])

          patch('app/src/main/java/com/zeus/v2/EqViewModel.kt', [
              ('var hiResEnabled by mutableStateOf(false)\n', 'var hiResEnabled by mutableStateOf(false)\n    var spatialEnabled by mutableStateOf(false)\n    var spatialWidth by mutableFloatStateOf(35f)\n'),
              ('selectedAudioSession=selectedAudioSession,hiResEnabled=hiResEnabled)', 'selectedAudioSession=selectedAudioSession,hiResEnabled=hiResEnabled,spatialEnabled=spatialEnabled,spatialWidth=spatialWidth)'),
              ('selectedAudioSession=s.selectedAudioSession;hiResEnabled=s.hiResEnabled;selectedBandIndex=0}', 'selectedAudioSession=s.selectedAudioSession;hiResEnabled=s.hiResEnabled;spatialEnabled=s.spatialEnabled;spatialWidth=s.spatialWidth;selectedBandIndex=0}')
          ])

          patch('app/src/main/java/com/zeus/v2/AudioEngine.kt', [
              ('import android.media.audiofx.Visualizer\n', 'import android.media.audiofx.Visualizer\n'),
              ('private var dynamicsProcessing:DynamicsProcessing?=null; private var visualizer:Visualizer?=null;', 'private var dynamicsProcessing:DynamicsProcessing?=null; private var visualizer:Visualizer?=null; private var spatialEngine:SpatialEngine?=null;'),
              ('release();audioSessionId=sessionId;deviceSampleRate=resolveSampleRate();', 'release();audioSessionId=sessionId;deviceSampleRate=resolveSampleRate();'),
              ('dynamicsProcessing=dp;preEqBandCount=bands;mbcBandCount=if(mbcUse)mbcCount else 0;applyAll();startVisualizer();dp.enabled=true;isEnabled=true;', 'dynamicsProcessing=dp;preEqBandCount=bands;mbcBandCount=if(mbcUse)mbcCount else 0;spatialEngine=SpatialEngine(sessionId).also{it.initialize()};applyAll();startVisualizer();dp.enabled=true;isEnabled=true;'),
              ('try{dynamicsProcessing?.release()}catch(_:Exception){};dynamicsProcessing=null;isEnabled=false}', 'try{spatialEngine?.release()}catch(_:Exception){};spatialEngine=null;try{dynamicsProcessing?.release()}catch(_:Exception){};dynamicsProcessing=null;isEnabled=false}'),
              ('fun setHiResEnabled(enabled:Boolean){hiResEnabled=enabled;applyInputGain();applyMbc();applyPostEq();applyLimiter();Log.i(TAG,"Hi-Res mode ${if(enabled) "ON" else "OFF"}")}', 'fun setHiResEnabled(enabled:Boolean){hiResEnabled=enabled;applyInputGain();applyMbc();applyPostEq();applyLimiter();Log.i(TAG,"Hi-Res mode ${if(enabled) "ON" else "OFF"}")}\n    fun setSpatialEnabled(enabled:Boolean){settings.spatialEnabled=enabled;spatialEngine?.setEnabled(enabled)}\n    fun setSpatialWidth(width:Float){settings.spatialWidth=width.coerceIn(0f,100f);spatialEngine?.setWidth(settings.spatialWidth)}'),
              ('fun applyAll(){applyInputGain();applyEq();applyMbc();applyPostEq();applyLimiter()}', 'fun applyAll(){applyInputGain();applyEq();applyMbc();applyPostEq();applyLimiter();spatialEngine?.setWidth(settings.spatialWidth);spatialEngine?.setEnabled(settings.spatialEnabled)}')
          ])

          ui='app/src/main/java/com/zeus/v2/ZeusStudioScreenV2.kt'
          patch(ui, [
              ('Text("HI-RES",color=if(vm.hiResEnabled) ZCY else ZM,fontSize=8.sp,fontWeight=FontWeight.ExtraBold)\n    Switch(checked=vm.hiResEnabled,onCheckedChange={vm.hiResEnabled=it},modifier=Modifier.height(30.dp))', 'Text("HI-RES",color=if(vm.hiResEnabled) ZCY else ZM,fontSize=8.sp,fontWeight=FontWeight.ExtraBold)\n    Switch(checked=vm.hiResEnabled,onCheckedChange={vm.hiResEnabled=it},modifier=Modifier.height(30.dp))\n    Text("SPATIAL",color=if(vm.spatialEnabled) ZP else ZM,fontSize=8.sp,fontWeight=FontWeight.ExtraBold,modifier=Modifier.padding(start=5.dp))\n    Switch(checked=vm.spatialEnabled,onCheckedChange={vm.spatialEnabled=it},modifier=Modifier.height(30.dp))'),
              ('Column(Modifier.weight(.9f).verticalScroll(rememberScrollState()),verticalArrangement=Arrangement.spacedBy(7.dp)){\n   SubSismoCard(vm); PunchCard(punch,vm); Pipe(vm)\n  }', 'Column(Modifier.weight(.9f).verticalScroll(rememberScrollState()),verticalArrangement=Arrangement.spacedBy(7.dp)){\n   SubSismoCard(vm); PunchCard(punch,vm); SpatialCard(vm); Pipe(vm)\n  }'),
              ('Column(Modifier.weight(1.15f)){ PunchCard(punch,vm) }', 'Column(Modifier.weight(1.15f)){ PunchCard(punch,vm); SpatialCard(vm) }')
          ])

          p=Path(ui); s=p.read_text()
          marker='@Composable private fun DynPage(vm:EqViewModel)'
          card='''@Composable private fun SpatialCard(vm:EqViewModel){\n Card("ZEUS SPATIAL") {\n  Row(verticalAlignment=Alignment.CenterVertically){\n   Column(Modifier.weight(1f)){\n    Text("SPATIAL ENGINE",color=ZT,fontSize=9.sp,fontWeight=FontWeight.Bold)\n    Text(if(vm.spatialEnabled) "Stereo virtualizer activo" else "Procesamiento espacial apagado",color=ZM,fontSize=8.sp)\n   }\n   Switch(checked=vm.spatialEnabled,onCheckedChange={vm.spatialEnabled=it})\n  }\n  S("WIDTH",vm.spatialWidth,0f..100f," %"){vm.spatialWidth=it}\n  Text("Centro estable · expansión estéreo controlada",color=ZM,fontSize=8.sp)\n }\n}\n\n'''
          if card not in s:
              if marker not in s: raise SystemExit('Missing UI card anchor')
              s=s.replace(marker,card+marker,1)
              p.write_text(s)
          PY
          rm -f .github/workflows/apply_spatial_foundation.yml
          git config user.name 'zeus-spatial-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/zeus/v2 .github/workflows/apply_spatial_foundation.yml
          git diff --cached --quiet || git commit -m 'Integrate Zeus Spatial engine controls'
          git push origin HEAD:fix/punch-v2
