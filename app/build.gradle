plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zeus.v2'
    compileSdk 34

    // versionCode estable y creciente. En CI se pasa VERSION_CODE con el numero
    // de corrida de Actions para que cada APK sea distinguible e instalable
    // encima del anterior.
    def buildVersionCode = (System.getenv("VERSION_CODE") ?: "21").toInteger()

    defaultConfig {
        applicationId "com.zeus.v2"
        minSdk 28   // DynamicsProcessing requires API 28+
        targetSdk 34
        versionCode buildVersionCode
        versionName "2.2-punch.${buildVersionCode}"
    }

    // Clave de firma estable. El keystore NO vive en el repositorio: en CI se
    // reconstruye desde el secreto DEBUG_KEYSTORE_B64 y en local puedes colocar
    // tu propio archivo en la raiz del proyecto.
    //
    // Sin una clave estable, cada runner de CI genera un debug.keystore nuevo y
    // dos APK consecutivos quedan firmados con claves distintas, lo que provoca
    // "conflicto con el paquete" (INSTALL_FAILED_UPDATE_INCOMPATIBLE) al instalar
    // una build encima de otra.
    def signingKeystore = rootProject.file(System.getenv("KEYSTORE_FILE") ?: 'zeus-debug.keystore')
    def hasSigningKeystore = signingKeystore.exists()

    signingConfigs {
        if (hasSigningKeystore) {
            debugFixed {
                storeFile signingKeystore
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: 'android'
                keyAlias System.getenv("KEY_ALIAS") ?: 'androiddebugkey'
                keyPassword System.getenv("KEY_PASSWORD") ?: 'android'
            }
        }
    }

    buildTypes {
        debug {
            // Si no hay keystore propio se usa la firma debug por defecto de Gradle.
            if (hasSigningKeystore) {
                signingConfig signingConfigs.debugFixed
            }
        }
        release {
            minifyEnabled false
            if (hasSigningKeystore) {
                signingConfig signingConfigs.debugFixed
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        viewBinding true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Compose
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
